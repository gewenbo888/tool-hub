<script src="/shared.js"></script>
<script>
const $ = s => document.querySelector(s);
const drop = $('#drop'), file = $('#file'), results = $('#results');
const origImg = $('#orig-img'), compImg = $('#comp-img');
const origMeta = $('#orig-meta'), compMeta = $('#comp-meta');
const quality = $('#quality'), qVal = $('#q-val'), format = $('#format'), maxw = $('#maxw');

let originalFile = null, originalUrl = null;

drop.onclick = () => file.click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); handle(e.dataTransfer.files[0]); };
file.onchange = e => handle(e.target.files[0]);

function fmt(b) {
  if (b > 1024 * 1024) return (b / 1024 / 1024).toFixed(2) + ' MB';
  return (b / 1024).toFixed(1) + ' KB';
}

function handle(f) {
  if (!f || !f.type.startsWith('image/')) return;
  originalFile = f;
  originalUrl = URL.createObjectURL(f);
  origImg.src = originalUrl;
  origImg.onload = () => {
    origMeta.textContent = `${origImg.naturalWidth}×${origImg.naturalHeight} · ${fmt(f.size)} · ${f.type.split('/')[1].toUpperCase()}`;
    results.style.display = 'block';
    drop.style.display = 'none';
    compress();
  };
}

function compress() {
  if (!originalFile) return;
  const img = new Image();
  img.onload = () => {
    let w = img.naturalWidth, h = img.naturalHeight;
    const cap = +maxw.value;
    if (cap > 0 && w > cap) { h = h * cap / w; w = cap; }
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    c.toBlob(blob => {
      compImg.src = URL.createObjectURL(blob);
      const pct = ((1 - blob.size / originalFile.size) * 100).toFixed(0);
      const color = pct > 0 ? 'var(--good)' : 'var(--warn)';
      compMeta.innerHTML = `${w}×${Math.round(h)} · ${fmt(blob.size)} · <span style="color:${color};">${pct > 0 ? '−' : '+'}${Math.abs(pct)}%</span>`;
      compImg._blob = blob;
    }, format.value, +quality.value);
  };
  img.src = originalUrl;
}

quality.oninput = () => { qVal.textContent = quality.value; compress(); };
format.onchange = compress;
maxw.oninput = compress;

$('#dl').onclick = () => {
  if (!compImg._blob) return;
  const ext = format.value.split('/')[1];
  const a = document.createElement('a');
  a.href = URL.createObjectURL(compImg._blob);
  a.download = (originalFile.name.replace(/\.[^.]+$/, '') || 'image') + '-compressed.' + ext;
  a.click();
};
$('#reset').onclick = () => {
  originalFile = null; results.style.display = 'none'; drop.style.display = 'block';
  if (originalUrl) URL.revokeObjectURL(originalUrl);
};
</script>
