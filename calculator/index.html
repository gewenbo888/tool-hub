<script src="/shared.js"></script>
<script>
const $ = s => document.querySelector(s);
const expr = $('#expr'), val = $('#val'), grid = $('#grid'), history = $('#history');
let cur = '', last = '0', mode = 'basic';

const BASIC = [
  ['C','clr'],['(','op'],[')','op'],['/','op'],
  ['7',''],['8',''],['9',''],['*','op'],
  ['4',''],['5',''],['6',''],['-','op'],
  ['1',''],['2',''],['3',''],['+','op'],
  ['0',''],['.',''],['=','eq'],
];
const SCI = [
  ['C','clr'],['(','op'],[')','op'],['^','op'],['π','op'],
  ['sin','op'],['cos','op'],['tan','op'],['log','op'],['e','op'],
  ['√','op'],['7',''],['8',''],['9',''],['/','op'],
  ['x²','op'],['4',''],['5',''],['6',''],['*','op'],
  ['ln','op'],['1',''],['2',''],['3',''],['-','op'],
  ['!','op'],['0',''],['.',''],['=','eq'],['+','op'],
];

function renderGrid() {
  grid.className = mode === 'sci' ? 'calc-grid sci' : 'calc-grid';
  const set = mode === 'sci' ? SCI : BASIC;
  grid.innerHTML = set.map(([k, t]) => `<button class="calc-btn ${t}" data-key="${k}">${k}</button>`).join('');
}
renderGrid();

document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
  document.querySelectorAll('[data-mode]').forEach(x => x.classList.remove('active'));
  b.classList.add('active'); mode = b.dataset.mode; renderGrid();
});

grid.addEventListener('click', e => {
  const k = e.target.dataset.key; if (!k) return; press(k);
});

function press(k) {
  if (k === 'C') { cur = ''; last = '0'; expr.textContent = '\u00A0'; val.textContent = '0'; return; }
  if (k === '=') { evalNow(); return; }
  if (k === 'π') cur += 'Math.PI';
  else if (k === 'e') cur += 'Math.E';
  else if (k === 'sin') cur += 'Math.sin(';
  else if (k === 'cos') cur += 'Math.cos(';
  else if (k === 'tan') cur += 'Math.tan(';
  else if (k === 'log') cur += 'Math.log10(';
  else if (k === 'ln') cur += 'Math.log(';
  else if (k === '√') cur += 'Math.sqrt(';
  else if (k === 'x²') cur += '**2';
  else if (k === '^') cur += '**';
  else if (k === '!') cur = `fact(${cur})`;
  else cur += k;
  expr.textContent = displayExpr(cur);
  try { const v = evaluate(cur); if (Number.isFinite(v)) val.textContent = format(v); } catch {}
}

function evalNow() {
  try {
    const v = evaluate(cur);
    if (!Number.isFinite(v)) throw new Error('overflow');
    last = format(v);
    history.innerHTML = `<div style="padding:6px 0;border-bottom:1px solid var(--border);">${displayExpr(cur)} = <span style="color:var(--accent);">${last}</span></div>` + history.innerHTML;
    cur = String(v);
    val.textContent = last; expr.textContent = '\u00A0';
  } catch (e) { val.textContent = 'Error'; }
}

function displayExpr(s) {
  return s.replace(/Math\.PI/g, 'π').replace(/Math\.E/g, 'e').replace(/Math\.sin\(/g, 'sin(').replace(/Math\.cos\(/g, 'cos(').replace(/Math\.tan\(/g, 'tan(').replace(/Math\.log10\(/g, 'log(').replace(/Math\.log\(/g, 'ln(').replace(/Math\.sqrt\(/g, '√(').replace(/\*\*/g, '^');
}

function evaluate(s) {
  const fact = n => n <= 1 ? 1 : n * fact(n - 1);
  return Function('"use strict";const fact=' + fact + ';return (' + (s || '0') + ')')();
}

function format(v) {
  if (Math.abs(v) > 1e15 || (Math.abs(v) < 1e-6 && v !== 0)) return v.toExponential(6);
  return parseFloat(v.toPrecision(12)).toString();
}

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const k = e.key;
  if (/[0-9.+\-*/()]/.test(k)) { press(k); }
  else if (k === 'Enter' || k === '=') { e.preventDefault(); press('='); }
  else if (k === 'Escape') press('C');
  else if (k === 'Backspace') { cur = cur.slice(0, -1); expr.textContent = displayExpr(cur); }
});
</script>
