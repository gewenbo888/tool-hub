<script>
const $ = s => document.querySelector(s);
const fromVal = $('#from-val'), toVal = $('#to-val'), fromUnit = $('#from-unit'), toUnit = $('#to-unit');

const UNITS = {
  length: { m: 1, km: 1000, cm: 0.01, mm: 0.001, in: 0.0254, ft: 0.3048, yd: 0.9144, mi: 1609.344 },
  weight: { kg: 1, g: 0.001, mg: 0.000001, lb: 0.45359237, oz: 0.0283495, ton: 1000, 'st (stone)': 6.35029 },
  area:   { 'm²': 1, 'km²': 1000000, 'ha': 10000, 'ft²': 0.092903, 'in²': 0.000645, acre: 4046.86, 'yd²': 0.836127 },
  volume: { L: 1, mL: 0.001, 'm³': 1000, 'gal (US)': 3.78541, 'qt (US)': 0.946353, 'pt (US)': 0.473176, 'fl oz (US)': 0.0295735, cup: 0.236588 },
  temp:   { '°C': 1, '°F': 2, 'K': 3 }
};

let cat = 'length';

function fillUnits() {
  const opts = Object.keys(UNITS[cat]).map(u => `<option value="${u}">${u}</option>`).join('');
  fromUnit.innerHTML = opts; toUnit.innerHTML = opts;
  if (cat === 'length') { fromUnit.value = 'm'; toUnit.value = 'ft'; }
  else if (cat === 'weight') { fromUnit.value = 'kg'; toUnit.value = 'lb'; }
  else if (cat === 'temp') { fromUnit.value = '°C'; toUnit.value = '°F'; }
  else if (cat === 'area') { fromUnit.value = 'm²'; toUnit.value = 'ft²'; }
  else if (cat === 'volume') { fromUnit.value = 'L'; toUnit.value = 'gal (US)'; }
}

function convert() {
  const v = parseFloat(fromVal.value);
  if (isNaN(v)) { toVal.value = ''; return; }
  if (cat === 'temp') { toVal.value = format(tempConvert(v, fromUnit.value, toUnit.value)); }
  else {
    const base = v * UNITS[cat][fromUnit.value];
    toVal.value = format(base / UNITS[cat][toUnit.value]);
  }
  renderRef();
}

function tempConvert(v, f, t) {
  let k = v;
  if (f === '°C') k = v + 273.15;
  if (f === '°F') k = (v - 32) * 5/9 + 273.15;
  if (t === 'K') return k;
  if (t === '°C') return k - 273.15;
  if (t === '°F') return (k - 273.15) * 9/5 + 32;
}

function format(n) {
  if (Math.abs(n) > 1e9 || (Math.abs(n) < 1e-4 && n !== 0)) return n.toExponential(4);
  return parseFloat(n.toPrecision(8)).toString();
}

function renderRef() {
  const ref = $('#ref');
  const refMap = {
    length: ['1 m = 3.281 ft', '1 km = 0.621 mi', '1 in = 2.54 cm', '1 mi = 1.609 km'],
    weight: ['1 kg = 2.205 lb', '1 lb = 0.454 kg', '1 oz = 28.35 g', '1 ton = 1000 kg'],
    temp:   ['0 °C = 32 °F', '100 °C = 212 °F', '0 K = -273.15 °C', '−40 °C = −40 °F'],
    area:   ['1 m² = 10.764 ft²', '1 ha = 2.471 acre', '1 km² = 100 ha', '1 acre = 4046.86 m²'],
    volume: ['1 L = 0.264 gal (US)', '1 gal (US) = 3.785 L', '1 cup = 236.6 mL', '1 m³ = 1000 L']
  };
  ref.innerHTML = refMap[cat].map(s => `<div>${s}</div>`).join('');
}

document.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => {
  document.querySelectorAll('[data-cat]').forEach(x => x.classList.remove('active'));
  b.classList.add('active'); cat = b.dataset.cat; fillUnits(); convert();
});

[fromVal, fromUnit, toUnit].forEach(el => el.addEventListener('input', convert));
$('#swap').onclick = () => { const a = fromUnit.value; fromUnit.value = toUnit.value; toUnit.value = a; convert(); };

fillUnits(); convert();

document.querySelector('[data-action="open-share"]').addEventListener('click', e => {
  e.target.closest('[data-action]').dataset.url = window.location.href;
});
</script>
