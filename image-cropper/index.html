<script src="/shared.js"></script>
<script>
const $ = s => document.querySelector(s);
const drop = $('#drop'), file = $('#file'), workspace = $('#workspace');
const src = $('#src'), stage = $('#stage'), overlay = $('#overlay'), dims = $('#dims');
let img = null, ratio = null;
let box = { x: 50, y: 50, w: 200, h: 200 };

drop.onclick = () => file.click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); handle(e.dataTransfer.files[0]); };
file.onchange = e => handle(e.target.files[0]);

function handle(f) {
  if (!f || !f.type.startsWith('image/')) return;
  const url = URL.createObjectURL(f);
  src.src = url;
  src.onload = () => {
    workspace.style.display = 'block'; drop.style.display = 'none';
    img = src;
    const w = src.clientWidth, h = src.clientHeight;
    box = { x: w * 0.1, y: h * 0.1, w: w * 0.8, h: h * 0.8 };
    if (ratio) snapToRatio();
    updateOverlay();
  };
}

function snapToRatio() {
  if (!ratio) return;
  box.h = box.w / ratio;
  if (box.h > src.clientHeight - box.y) {
    box.h = src.clientHeight - box.y;
    box.w = box.h * ratio;
  }
}

function updateOverlay() {
  overlay.style.left = box.x + 'px';
  overlay.style.top = box.y + 'px';
  overlay.style.width = box.w + 'px';
  overlay.style.height = box.h + 'px';
  const sx = src.naturalWidth / src.clientWidth;
  dims.textContent = `${Math.round(box.w * sx)} × ${Math.round(box.h * sx)} px`;
}

document.querySelectorAll('[data-ratio]').forEach(b => b.onclick = () => {
  document.querySelectorAll('[data-ratio]').forEach(x => x.classList.remove('active'));
  b.classList.add('active'); ratio = b.dataset.ratio === 'free' ? null : +b.dataset.ratio;
  if (ratio) snapToRatio();
  updateOverlay();
});

let drag = null;
overlay.addEventListener('mousedown', e => {
  e.preventDefault();
  const handle = e.target.classList.contains('crop-handle') ? e.target.className.replace('crop-handle ', '') : 'move';
  drag = { handle, sx: e.clientX, sy: e.clientY, ix: box.x, iy: box.y, iw: box.w, ih: box.h };
});
window.addEventListener('mousemove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (drag.handle === 'move') {
    box.x = Math.max(0, Math.min(src.clientWidth - box.w, drag.ix + dx));
    box.y = Math.max(0, Math.min(src.clientHeight - box.h, drag.iy + dy));
  } else {
    let nx = drag.ix, ny = drag.iy, nw = drag.iw, nh = drag.ih;
    if (drag.handle.includes('l')) { nx = drag.ix + dx; nw = drag.iw - dx; }
    if (drag.handle.includes('r')) { nw = drag.iw + dx; }
    if (drag.handle.includes('t')) { ny = drag.iy + dy; nh = drag.ih - dy; }
    if (drag.handle.includes('b')) { nh = drag.ih + dy; }
    if (ratio) nh = nw / ratio;
    if (nw > 30 && nh > 30 && nx >= 0 && ny >= 0 && nx + nw <= src.clientWidth && ny + nh <= src.clientHeight) {
      box.x = nx; box.y = ny; box.w = nw; box.h = nh;
    }
  }
  updateOverlay();
});
window.addEventListener('mouseup', () => drag = null);

$('#dl').onclick = () => {
  const sx = src.naturalWidth / src.clientWidth;
  const c = document.createElement('canvas');
  c.width = box.w * sx; c.height = box.h * sx;
  c.getContext('2d').drawImage(src, box.x * sx, box.y * sx, box.w * sx, box.h * sx, 0, 0, c.width, c.height);
  c.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'crop.png'; a.click();
  });
};
$('#reset').onclick = () => { workspace.style.display = 'none'; drop.style.display = 'block'; };
</script>
