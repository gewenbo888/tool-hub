<script src="/shared.js"></script>
<script>
const $ = s => document.querySelector(s);
const content = $('#content'), fg = $('#fg'), bg = $('#bg'), size = $('#size'), ec = $('#ec');
const sizeVal = $('#size-val'), preview = $('#qr-preview'), wm = $('#wm'), wmText = $('#wm-text');

let qr;
function render() {
  preview.innerHTML = '';
  const text = content.value.trim() || ' ';
  const ECMap = { L: QRCode.CorrectLevel.L, M: QRCode.CorrectLevel.M, Q: QRCode.CorrectLevel.Q, H: QRCode.CorrectLevel.H };
  qr = new QRCode(preview, {
    text, width: +size.value, height: +size.value,
    colorDark: fg.value, colorLight: bg.value, correctLevel: ECMap[ec.value]
  });
  sizeVal.textContent = size.value;
  wmText.style.display = wm.checked ? 'block' : 'none';
  TH.saveInput('qr', JSON.stringify({ text, fg: fg.value, bg: bg.value, size: size.value, ec: ec.value, wm: wm.checked }));
}

[content, fg, bg, size, ec, wm].forEach(el => el.addEventListener('input', render));

$('#dl-png').onclick = () => {
  const canvas = preview.querySelector('canvas');
  if (!canvas) return;
  let final = canvas;
  if (wm.checked) {
    const c = document.createElement('canvas');
    c.width = canvas.width; c.height = canvas.height + 30;
    const ctx = c.getContext('2d');
    ctx.fillStyle = bg.value; ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(canvas, 0, 0);
    ctx.fillStyle = fg.value; ctx.font = '14px monospace'; ctx.textAlign = 'center';
    ctx.fillText('Made with tools.psyverse.fun', c.width/2, canvas.height + 20);
    final = c;
  }
  const a = document.createElement('a');
  a.href = final.toDataURL('image/png'); a.download = 'qr.png'; a.click();
};

$('#dl-svg').onclick = () => {
  const text = content.value.trim() || ' ';
  const cell = 4, modules = qrModules(text, ec.value);
  const n = modules.length;
  const sz = n * cell;
  let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}"><rect width="${sz}" height="${sz}" fill="${bg.value}"/>`;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (modules[y][x]) svg += `<rect x="${x*cell}" y="${y*cell}" width="${cell}" height="${cell}" fill="${fg.value}"/>`;
  svg += '</svg>';
  const blob = new Blob([svg], { type: 'image/svg+xml' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'qr.svg'; a.click();
};

function qrModules(text, level) {
  const tmp = document.createElement('div');
  const ECMap = { L: QRCode.CorrectLevel.L, M: QRCode.CorrectLevel.M, Q: QRCode.CorrectLevel.Q, H: QRCode.CorrectLevel.H };
  const q = new QRCode(tmp, { text, correctLevel: ECMap[level] });
  const m = q._oQRCode.modules;
  return m;
}

const state = TH.parseStateFromHash();
if (state && state.text) { content.value = state.text; if (state.fg) fg.value = state.fg; if (state.bg) bg.value = state.bg; if (state.size) size.value = state.size; }
else { try { const s = JSON.parse(TH.loadInput('qr') || '{}'); if (s.text) content.value = s.text; } catch {} }
render();

document.querySelector('[data-action="open-share"]').addEventListener('click', e => {
  e.target.closest('[data-action]').dataset.url = TH.shareableURL({ text: content.value, fg: fg.value, bg: bg.value, size: size.value });
});
</script>
