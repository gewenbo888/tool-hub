<script src="/shared.js"></script>
<script>
const $ = s => document.querySelector(s);
const len = $('#len'), lenVal = $('#len-val'), pw = $('#pw');
const fill = $('#sfill'), label = $('#slabel'), entropyEl = $('#entropy'), history = $('#history');

const SETS = {
  upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
  lower: 'abcdefghijklmnopqrstuvwxyz',
  num:   '0123456789',
  sym:   '!@#$%^&*()-_=+[]{};:,.<>/?',
  ambig: '0OIl1'
};
const PRON_C = 'bcdfghjklmnpqrstvwxz', PRON_V = 'aeiouy';

function randInt(max) {
  const buf = new Uint32Array(1);
  crypto.getRandomValues(buf);
  return buf[0] % max;
}
function pick(s) { return s[randInt(s.length)]; }

function buildPool() {
  let pool = '';
  if ($('#opt-upper').checked) pool += SETS.upper;
  if ($('#opt-lower').checked) pool += SETS.lower;
  if ($('#opt-num').checked)   pool += SETS.num;
  if ($('#opt-sym').checked)   pool += SETS.sym;
  if ($('#opt-noambig').checked) pool = pool.split('').filter(c => !SETS.ambig.includes(c)).join('');
  return pool;
}

function generate() {
  const length = +len.value;
  let result = '';
  if ($('#opt-pron').checked) {
    let toggle = randInt(2);
    for (let i = 0; i < length; i++) {
      result += pick(toggle ? PRON_C : PRON_V);
      toggle = 1 - toggle;
    }
    if ($('#opt-num').checked) result = result.slice(0, -2) + pick(SETS.num) + pick(SETS.num);
  } else {
    const pool = buildPool();
    if (!pool) { pw.textContent = 'Pick at least one set'; return; }
    for (let i = 0; i < length; i++) result += pick(pool);
  }
  pw.textContent = result;
  updateStrength(result);
  saveHistory(result);
}

function updateStrength(p) {
  const pool = buildPool().length || 26;
  const bits = Math.log2(pool) * p.length;
  let pct = Math.min(100, bits / 1.28);
  let color = 'var(--danger)', txt = 'Weak', zh = '弱';
  if (bits >= 60) { color = 'var(--good)';  txt = 'Strong'; zh = '强'; }
  else if (bits >= 40) { color = 'var(--accent)'; txt = 'Good'; zh = '良好'; }
  else if (bits >= 28) { color = 'var(--warn)'; txt = 'Medium'; zh = '中等'; }
  fill.style.width = pct + '%'; fill.style.background = color;
  label.textContent = document.body.dataset.lang === 'zh' ? zh : txt;
  label.style.color = color;
  entropyEl.textContent = bits.toFixed(1) + ' bits';
}

function saveHistory(pwd) {
  let h = JSON.parse(localStorage.getItem('th-pw-hist') || '[]');
  h.unshift(pwd);
  h = h.slice(0, 5);
  localStorage.setItem('th-pw-hist', JSON.stringify(h));
  renderHistory();
}
function renderHistory() {
  const h = JSON.parse(localStorage.getItem('th-pw-hist') || '[]');
  history.innerHTML = h.length
    ? h.map(p => `<div style="padding:6px 10px;background:var(--surface);border:1px solid var(--border);border-radius:4px;margin-bottom:4px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;" onclick="navigator.clipboard.writeText(this.querySelector('span').textContent);TH.toast('Copied!','已复制!');"><span>${p}</span><span style="color:var(--text-faint);font-size:.7rem;">click to copy</span></div>`).join('')
    : '<span class="empty">No history yet.</span>';
}

len.addEventListener('input', () => { lenVal.textContent = len.value; });
$('#btn-gen').onclick = generate;
document.querySelectorAll('input[type=checkbox], #len').forEach(el => el.addEventListener('change', () => { if (pw.textContent !== 'click generate') generate(); }));

generate();
renderHistory();
</script>
